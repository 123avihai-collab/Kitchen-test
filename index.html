<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1b1a">
<title>מטבח תלת-ממדי – ניסוי</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="viewport"><canvas id="c"></canvas></div>

<header id="toolbar">
  <div class="brand"><span class="dot"></span><span class="t">מטבח • ניסוי</span></div>
  <div class="group seg" id="mode-seg" role="tablist" aria-label="מצב">
    <button data-mode="view" class="on" title="צפייה – לחיצה פותחת דלתות ומגירות"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>צפייה</span></button>
    <button data-mode="edit" title="עריכה – לחיצה בוחרת ארון"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg><span>עריכה</span></button>
    <button data-mode="measure" title="מדידה – לחץ על שתי נקודות"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg><span>מדידה</span></button>
  </div>
  <div class="group seg" id="cam-seg" aria-label="תנועה">
    <button data-cam="orbit" class="on" title="סיבוב סביב החדר"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span>סיבוב</span></button>
    <button data-cam="walk" title="הליכה בגובה עיניים"><svg viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M10 21l2-6 3 3v3M9 12l1-4 4 1 2 4M10 8l-3 3"/></svg><span>הליכה</span></button>
  </div>
  <div class="group">
    <button id="btn-dims" class="tgl" title="הצג/הסתר קווי מידות"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 4v6M21 4v6M7 21V11M4 21h6"/></svg><span>מידות</span></button>
    <button id="btn-undo" title="ביטול (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="btn-redo" title="חזרה (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button id="btn-panel" class="tgl" title="פאנל עריכה"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg><span>פאנל</span></button>
  </div>
</header>

<aside id="panel" aria-label="פאנל עריכה">
  <div class="grip" id="panel-grip"><span></span></div>
  <nav id="tabs"></nav>
  <div id="panel-body"></div>
</aside>

<button id="btn-share" class="fab" title="שליחת התכנון"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg><span>שליחת התכנון</span></button>
<div id="joystick" aria-hidden="true"><div class="knob"></div></div>
<div id="hint"></div>
<div id="toast"></div>
<div id="measure-bar"><button id="btn-clear-measure">נקה מדידות</button></div>

<div id="loader">
  <div class="box">
    <div class="title">טוען מטבח…</div>
    <div class="bar"><i id="load-bar"></i></div>
    <div class="sub" id="load-sub">טקסטורות PBR ותאורת HDRI</div>
  </div>
</div>
<input type="file" id="file-import" accept=".json,application/json" hidden>
<input type="file" id="file-image" accept="image/*" hidden>

<script type="module" src="js/main.js"></script>
</body>
</html>
